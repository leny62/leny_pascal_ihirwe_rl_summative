[project]
name = "umurima-rl"
version = "0.1.0"
description = "Reinforcement learning agent for season-long irrigation and input scheduling on a Rwandan smallholder horticulture block"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Leny Pascal Ihirwe", email = "lihirwe6@gmail.com" }]

dependencies = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
    "torch>=2.4.0",
    "numpy>=1.26,<3",
    "pygame>=2.6.0",
    "PyOpenGL>=3.1.7",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "tensorboard>=2.16.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
umurima = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training", "analysis", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
